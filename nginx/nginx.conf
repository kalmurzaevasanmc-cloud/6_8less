server {
    listen 80;
    server_name localhost;

    # Максимальный размер загружаемых файлов (например, для медиа)
    client_max_body_size 20M;

    # Раздача статических файлов из смонтированного тома
    location /static/ {
        alias /var/html/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Раздача медиафайлов из смонтированного тома
    location /media/ {
        alias /var/html/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Проксирование всех остальных запросов на контейнер backend (Gunicorn)
    location / {
        proxy_pass http://backend:8000;
        
        # Передача оригинальных заголовков запроса
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}