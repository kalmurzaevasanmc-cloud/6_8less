version: '3.8'

services:
  backend:
    build: .
    command: ./start.sh
    volumes:
      - back_static:/app/static
      - back_media:/app/media
    expose:
      - "8000"
    restart: always

  nginx:
    build: ./nginx  # или image: nginx:1.25-alpine, если не используете отдельный Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - back_static:/var/html/static:ro
      - back_media:/var/html/media:ro
    depends_on:
      - backend
    restart: always

volumes:
  back_static:
  back_media: 